name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: JS syntax
        run: |
          for f in $(find docs/js -name '*.js'); do node --check "$f"; done

      - name: i18n key parity, references, unused keys
        run: node scripts/check-i18n.mjs

      - name: no em-dash / arrow characters
        run: |
          if grep -rlP "[\x{2192}\x{2190}\x{2014}]" docs README.md; then
            echo "found forbidden dash/arrow characters"; exit 1
          fi

      - name: unit tests
        run: npm test

      - run: npm ci
      - name: install Chromium
        run: npx playwright install --with-deps chromium
      - name: e2e tests (mocked mail APIs)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: pytest
        run: pytest -q
